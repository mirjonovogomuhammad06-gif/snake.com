<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070a12;
      --card: rgba(15, 20, 35, 0.78);
      --border: rgba(255, 255, 255, 0.08);
      --green: #36f59b;
      --green-dark: #0fa968;
      --blue: #5b8cff;
      --text: #f5f7ff;
      --muted: #8b93a7;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: Inter, Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(circle at 20% 20%, rgba(54, 245, 155, 0.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(91, 140, 255, 0.14), transparent 30%),
        var(--bg);
    }

    .game {
      width: 100%;
      max-width: 620px;
      padding: 24px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;

      backdrop-filter: blur(20px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px rgba(255, 255, 255, 0.04);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;

      border-radius: 14px;

      background: linear-gradient(135deg, var(--green), #16c97b);
      color: #03130c;

      font-size: 23px;
      font-weight: 900;

      box-shadow: 0 0 30px rgba(54, 245, 155, 0.25);
    }

    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .stats {
      display: flex;
      gap: 10px;
    }

    .stat {
      min-width: 82px;
      padding: 10px 14px;
      text-align: center;

      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 19px;
    }

    .board-wrap {
      position: relative;
    }

    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;

      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.07);

      background: #080d17;
      box-shadow:
        inset 0 0 50px rgba(0, 0, 0, 0.35),
        0 15px 45px rgba(0, 0, 0, 0.25);
    }

    .overlay {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      border-radius: 22px;
      background: rgba(5, 8, 15, 0.68);
      backdrop-filter: blur(7px);

      text-align: center;
      padding: 30px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 34px;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .overlay p {
      color: var(--muted);
      margin-bottom: 22px;
    }

    button {
      border: 0;
      cursor: pointer;

      padding: 13px 25px;
      border-radius: 13px;

      color: #03130c;
      background: linear-gradient(135deg, var(--green), #18cf80);

      font-size: 14px;
      font-weight: 800;

      box-shadow: 0 8px 25px rgba(54, 245, 155, 0.22);

      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(54, 245, 155, 0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 18px;
      gap: 15px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .pause {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 52px);
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .mobile-controls button {
      width: 52px;
      height: 52px;
      padding: 0;

      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      box-shadow: none;

      font-size: 18px;
    }

    .mobile-controls .empty {
      visibility: hidden;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #5f6779;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .game {
        padding: 16px;
        border-radius: 22px;
      }

      .top {
        align-items: flex-start;
      }

      .stats {
        gap: 6px;
      }

      .stat {
        min-width: 62px;
        padding: 8px;
      }

      .stat strong {
        font-size: 16px;
      }

      .hint {
        display: none;
      }

      .mobile-controls {
        display: grid;
      }
    }
  </style>
</head>

<body>

  <main class="game">

    <div class="top">
      <div class="brand">
        <div class="logo">S</div>

        <div>
          <h1>Neon Snake</h1>
          <div class="subtitle">Classic game · Modern experience</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>

        <div class="stat">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </div>

    <div class="board-wrap">

      <canvas id="gameCanvas" width="600" height="600"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Neon Snake</h2>

        <p id="overlayText">
          Собери еду и стань самым длинным.
        </p>

        <button id="startBtn">
          Начать игру
        </button>
      </div>

    </div>

    <div class="controls">
      <div class="hint">
        Управление: ↑ ↓ ← → или WASD
      </div>

      <button class="pause" id="pauseBtn">
        Пауза
      </button>
    </div>

    <div class="mobile-controls">

      <button class="empty"></button>

      <button data-direction="up">↑</button>

      <button class="empty"></button>

      <button data-direction="left">←</button>

      <button data-direction="down">↓</button>

      <button data-direction="right">→</button>

    </div>

    <div class="footer">
      Built with HTML · CSS · JavaScript
    </div>

  </main>


  <script>

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const grid = 24;
    const cell = canvas.width / grid;

    let snake;
    let food;

    let direction;
    let nextDirection;

    let score = 0;
    let best = Number(localStorage.getItem("snakeBest")) || 0;

    let gameRunning = false;
    let paused = false;

    let lastTime = 0;
    let accumulator = 0;

    let speed = 115;


    bestElement.textContent = best;


    function resetGame() {

      snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };

      score = 0;
      speed = 115;

      scoreElement.textContent = score;

      createFood();

      draw();

    }


    function createFood() {

      do {

        food = {
          x: Math.floor(Math.random() * grid),
          y: Math.floor(Math.random() * grid)
        };

      } while (
        snake.some(
          part => part.x === food.x && part.y === food.y
        )
      );

    }


    function startGame() {

      resetGame();

      gameRunning = true;
      paused = false;

      overlay.classList.add("hidden");

      pauseBtn.textContent = "Пауза";

      lastTime = performance.now();

      requestAnimationFrame(gameLoop);

    }


    function gameOver() {

      gameRunning = false;

      if (score > best) {

        best = score;

        localStorage.setItem("snakeBest", best);

        bestElement.textContent = best;

      }

      overlayTitle.textContent = "Игра окончена";
      overlayText.textContent =
        `Ваш результат: ${score}`;

      startBtn.textContent = "Играть снова";

      overlay.classList.remove("hidden");

    }


    function togglePause() {

      if (!gameRunning) return;

      paused = !paused;

      pauseBtn.textContent =
        paused ? "Продолжить" : "Пауза";

    }


    function setDirection(newDirection) {

      if (
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y
      ) {
        return;
      }

      nextDirection = newDirection;

    }


    function update() {

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };


      // Столкновение со стеной
      if (
        head.x < 0 ||
        head.x >= grid ||
        head.y < 0 ||
        head.y >= grid
      ) {

        gameOver();
        return;

      }


      // Столкновение с собой
      if (
        snake.some(
          part =>
            part.x === head.x &&
            part.y === head.y
        )
      ) {

        gameOver();
        return;

      }


      snake.unshift(head);


      // Съели еду
      if (
        head.x === food.x &&
        head.y === food.y
      ) {

        score++;

        scoreElement.textContent = score;

        // Постепенно ускоряем игру
        speed = Math.max(55, 115 - score * 2);

        createFood();

      } else {

        snake.pop();

      }

    }


    function drawBackground() {

      ctx.fillStyle = "#080d17";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // Сетка
      ctx.strokeStyle =
        "rgba(255,255,255,0.025)";

      ctx.lineWidth = 1;

      for (let i = 0; i <= grid; i++) {

        const position = i * cell;

        ctx.beginPath();

        ctx.moveTo(position, 0);
        ctx.lineTo(position, canvas.height);

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(0, position);
        ctx.lineTo(canvas.width, position);

        ctx.stroke();

      }

    }


    function drawFood() {

      const centerX =
        food.x * cell + cell / 2;

      const centerY =
        food.y * cell + cell / 2;


      const gradient =
        ctx.createRadialGradient(
          centerX,
          centerY,
          2,
          centerX,
          centerY,
          cell
        );

      gradient.addColorStop(
        0,
        "#ffffff"
      );

      gradient.addColorStop(
        0.25,
        "#ff4f9a"
      );

      gradient.addColorStop(
        1,
        "rgba(255,79,154,0)"
      );


      ctx.fillStyle = gradient;

      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        cell * 0.8,
        0,
        Math.PI * 2
      );

      ctx.fill();


      ctx.fillStyle = "#ff4f9a";

      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        cell * 0.25,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    function drawSnake() {

      snake.forEach((part, index) => {

        const padding = index === 0 ? 2 : 3;

        const x = part.x * cell + padding;
        const y = part.y * cell + padding;

        const size = cell - padding * 2;


        const gradient =
          ctx.createLinearGradient(
            x,
            y,
            x + size,
            y + size
          );

        gradient.addColorStop(
          0,
          index === 0
            ? "#8affc9"
            : "#36f59b"
        );

        gradient.addColorStop(
          1,
          "#0fa968"
        );


        ctx.shadowColor =
          "rgba(54,245,155,0.45)";

        ctx.shadowBlur =
          index === 0 ? 15 : 8;

        ctx.fillStyle = gradient;


        ctx.beginPath();

        ctx.roundRect(
          x,
          y,
          size,
          size,
          6
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        // Глаза
        if (index === 0) {

          ctx.fillStyle = "#06130d";

          const eyeSize = 3;

          let eye1X;
          let eye1Y;
          let eye2X;
          let eye2Y;


          if (direction.x !== 0) {

            eye1X =
              x + size / 2;

            eye2X =
              x + size / 2;

            eye1Y =
              y + size * 0.3;

            eye2Y =
              y + size * 0.7;

          } else {

            eye1X =
              x + size * 0.3;

            eye2X =
              x + size * 0.7;

            eye1Y =
              y + size / 2;

            eye2Y =
              y + size / 2;

          }


          ctx.fillRect(
            eye1X - eyeSize / 2,
            eye1Y - eyeSize / 2,
            eyeSize,
            eyeSize
          );

          ctx.fillRect(
            eye2X - eyeSize / 2,
            eye2Y - eyeSize / 2,
            eyeSize,
            eyeSize
          );

        }

      });

    }


    function draw() {

      drawBackground();

      drawFood();

      drawSnake();

    }


    function gameLoop(time) {

      if (!gameRunning) return;

      requestAnimationFrame(gameLoop);


      if (paused) {

        lastTime = time;

        return;

      }


      const delta =
        time - lastTime;

      lastTime = time;

      accumulator += delta;


      if (accumulator >= speed) {

        update();

        accumulator = 0;

      }


      draw();

    }


    // Клавиатура
    document.addEventListener(
      "keydown",
      event => {

        const key =
          event.key.toLowerCase();


        if (
          key === "arrowup" ||
          key === "w"
        ) {

          event.preventDefault();

          setDirection({
            x: 0,
            y: -1
          });

        }


        if (
          key === "arrowdown" ||
          key === "s"
        ) {

          event.preventDefault();

          setDirection({
            x: 0,
            y: 1
          });

        }


        if (
          key === "arrowleft" ||
          key === "a"
        ) {

          event.preventDefault();

          setDirection({
            x: -1,
            y: 0
          });

        }


        if (
          key === "arrowright" ||
          key === "d"
        ) {

          event.preventDefault();

          setDirection({
            x: 1,
            y: 0
          });

        }


        if (key === " ") {

          event.preventDefault();

          togglePause();

        }

      }
    );


    // Мобильные кнопки
    document
      .querySelectorAll(
        "[data-direction]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const dir =
              button.dataset.direction;

            if (dir === "up") {

              setDirection({
                x: 0,
                y: -1
              });

            }

            if (dir === "down") {

              setDirection({
                x: 0,
                y: 1
              });

            }

            if (dir === "left") {

              setDirection({
                x: -1,
                y: 0
              });

            }

            if (dir === "right") {

              setDirection({
                x: 1,
                y: 0
              });

            }

          }
        );

      });


    startBtn.addEventListener(
      "click",
      startGame
    );


    pauseBtn.addEventListener(
      "click",
      togglePause
    );


    resetGame();

  </script>

</body>
</html>
